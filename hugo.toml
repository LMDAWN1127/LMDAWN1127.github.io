baseURL = "https://LMDAWN1127.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "DAWN's Blog"
theme = "PaperMod"
paginate = 5
mainSections = ["posts"]

enableEmoji = true
enableRobotsTXT = true

[services.googleAnalytics]
  id = ""

[languages]
  [languages.zh]
    languageName = "中文"
    weight = 1
    title = "DAWN's Blog"

  [languages.en]
    languageName = "English"
    weight = 2
    title = "DAWN's Blog"

  [languages.ko]
    languageName = "한국어"
    weight = 3
    title = "DAWN's Blog"

  [languages.ja]
    languageName = "日本語"
    weight = 4
    title = "DAWN's Blog"

[params]

  [params.homeInfoParams]
    Title = "欢迎来到 DAWN's Blog"
    Content = "分享 Docker、Linux、KVM、DevOps 等技术实践与学习笔记"
  env = "production"
  keywords = ["博客", "技术", "Claude Code", "AI", "CentOS", "Docker", "Linux", "DevOps"]
  author = "DAWN"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  disableSearch = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  images = ["/images/DAWN.jpg"]

  [params.editPost]
    URL = "https://github.com/LMDAWN1127/LMDAWN1127.github.io/edit/main/content/"
    Text = "编辑本文"
    appendFilePath = true

  [params.assets]
    favicon = "/images/DAWN.jpg"
    disableFingerprinting = false
    [params.assets.images]
      quality = 80
      resampleFilter = "Lanczos"

  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

  [params.label]
    text = "DAWN's Blog"
    icon = "/images/DAWN.jpg"
    iconHeight = 38

  [params.opengraph]
    enabled = true

  [params.twitter]
    enabled = true

  [params.comments]
    enabled = true

  [params.share]
    enabled = false

  [params.related]
    enabled = true
    count = 3

  [params.readingTime]
    wordsPerMinute = 200

  [params.backToTop]
    enabled = true

  [params.algolia]
    appId = "Y0SCRI4LCW"
    apiKey = "03dda5e44aec7e0dd93b6a3653250b1f"
    indexName = "lmdawn1127-blog"

# 多语言菜单（只保留 Archive）
[languages.zh.menu]
  [[languages.zh.menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20

[languages.en.menu]
  [[languages.en.menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20

[languages.ko.menu]
  [[languages.ko.menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20

[languages.ja.menu]
  [[languages.ja.menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest", "Algolia"]

[outputFormats.WebAppManifest]
  mediaType = "application/manifest+json"
  rel = "manifest"
  baseName = "manifest"

[outputFormats.Algolia]
  baseName = "algolia"
  isPlainText = true
  mediaType = "application/json"
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

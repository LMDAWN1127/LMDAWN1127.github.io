baseURL = "https://LMDAWN1127.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "DAWN's Blog"
theme = "PaperMod"
paginate = 10

enableEmoji = true
enableRobotsTXT = true

[services.googleAnalytics]
  id = ""

[languages]
  [languages.zh]
    languageName = "中文"
    weight = 1
    title = "DAWN's Blog"
    [languages.zh.params]
      description = "技术分享 | 学习笔记 | 生活记录"
      [languages.zh.params.homeInfoParams]
        Title = "Hi, 我是 DAWN"
        Content = "热爱技术的开发者，专注 AI 编程工具、Linux 运维、Web 开发。喜欢探索新技术，折腾服务器，写代码解决问题。"

  [languages.en]
    languageName = "English"
    weight = 2
    title = "DAWN's Blog"
    [languages.en.params]
      description = "Tech Sharing | Study Notes | Life Records"
      [languages.en.params.homeInfoParams]
        Title = "Hi, I'm DAWN"
        Content = "A developer passionate about technology, focused on AI coding tools, Linux operations, and web development. Love exploring new tech, tinkering with servers, and solving problems with code."

  [languages.ko]
    languageName = "한국어"
    weight = 3
    title = "DAWN's Blog"
    [languages.ko.params]
      description = "기술 공유 | 학습 노트 | 일상 기록"
      [languages.ko.params.homeInfoParams]
        Title = "안녕하세요, DAWN입니다"
        Content = "기술에 열정을 가진 개발자로, AI 코딩 도구, Linux 운영, 웹 개발에 집중합니다. 새로운 기술을 탐색하고, 서버를 만지작거리며, 코드로 문제를 해결하는 것을 좋아합니다."

  [languages.ja]
    languageName = "日本語"
    weight = 4
    title = "DAWN's Blog"
    [languages.ja.params]
      description = "技術共有 | 学習ノート | 生活記録"
      [languages.ja.params.homeInfoParams]
        Title = "こんにちは、DAWNです"
        Content = "技術に情熱を持つ開発者として、AIコーディングツール、Linux運用、Web開発に焦点を当てています。新技術の探求、サーバーのいじり、コードによる問題解決が好きです。"

[params]
  env = "production"
    keywords = ["博客", "技术", "Claude Code", "AI", "CentOS", "Docker", "Linux", "DevOps"]
  author = "DAWN"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  disableSearch = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  images = ["/images/DAWN.jpg"]

    [params.profileMode]
    enabled = false
    imageUrl = "/images/DAWN.jpg"
    Title = "Hi, 我是 DAWN"
    Content = """
    热爱技术的开发者

    专注 AI 编程工具、Linux 运维、Web 开发

    喜欢探索新技术，折腾服务器，写代码解决问题
    """

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/LMDAWN1127"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.editPost]
    URL = "https://github.com/LMDAWN1127/LMDAWN1127.github.io/edit/main/content/"
    Text = "编辑本文"
    appendFilePath = true

  [params.assets]
    favicon = "/favicon.svg"
    disableFingerprinting = false
    [params.assets.images]
      quality = 80
      resampleFilter = "Lanczos"

  [params.cover]
  hidden = true
  hiddenInList = true
  hiddenInSingle = true

  [params.label]
    text = "DAWN's Blog"
    icon = "/images/DAWN.jpg"
    iconHeight = 35

  [params.opengraph]
    enabled = true

  [params.twitter]
    enabled = true

  [params.comments]
    enabled = true

  [params.share]
    enabled = true
    platforms = ["twitter", "facebook", "linkedin", "reddit", "telegram", "weibo", "qq"]

  [params.related]
    enabled = true
    count = 3

  [params.readingTime]
    wordsPerMinute = 200

  [params.backToTop]
    enabled = true

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest"]

[outputFormats.WebAppManifest]
  mediaType = "application/manifest+json"
  rel = "manifest"
  baseName = "manifest"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

<!-- Algolia Search Modal -->
<div id="algolia-search-modal" class="algolia-modal" style="display: none;">
  <div class="algolia-modal-overlay"></div>
  <div class="algolia-modal-content">
    <div class="algolia-search-header">
      <div class="algolia-search-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="algolia-search-input" placeholder="搜索文章..." autofocus>
        <kbd class="algolia-esc">Esc</kbd>
      </div>
    </div>
    <div id="algolia-search-results" class="algolia-search-results">
      <div class="algolia-empty-state">
        <p>输入关键词开始搜索</p>
      </div>
    </div>
    <div class="algolia-search-footer">
      <span class="algolia-footer-text">
        <kbd>↑</kbd> <kbd>↓</kbd> 导航
        <kbd>↵</kbd> 打开
        <kbd>Esc</kbd> 关闭
      </span>
      <span class="algolia-footer-logo">
        搜索由 <a href="https://www.algolia.com/" target="_blank" rel="noopener">Algolia</a> 提供
      </span>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var APP_ID = '{{ .Site.Params.algolia.appId }}';
  var SEARCH_KEY = '{{ .Site.Params.algolia.apiKey }}';
  var INDEX_NAME = '{{ .Site.Params.algolia.indexName }}';
  var API_URL = 'https://' + APP_ID + '-dsn.algolia.net/1/indexes/' + INDEX_NAME + '/query';
  var debounceTimer = null;
  var selectedIndex = -1;

  /* ---- Search via fetch ---- */
  function doSearch(query) {
    if (!query || !query.trim()) {
      showEmpty();
      return;
    }

    var body = JSON.stringify({
      query: query,
      hitsPerPage: 10,
      attributesToRetrieve: ['title', 'content', 'url', 'date', 'tags'],
      attributesToHighlight: ['title', 'content'],
      highlightPreFragment: '<mark class="algolia-highlight">',
      highlightPostFragment: '</mark>'
    });

    fetch(API_URL, {
      method: 'POST',
      headers: {
        'X-Algolia-Application-Id': APP_ID,
        'X-Algolia-API-Key': SEARCH_KEY,
        'Content-Type': 'application/json'
      },
      body: body
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      renderResults(data.hits || [], query);
    })
    .catch(function(err) {
      console.error('Algolia search error:', err);
      showError(err.message || '未知错误');
    });
  }

  /* ---- UI helpers ---- */
  function showEmpty() {
    document.getElementById('algolia-search-results').innerHTML =
      '<div class="algolia-empty-state"><p>输入关键词开始搜索</p></div>';
  }

  function showError(detail) {
    var msg = '搜索出错，请稍后再试';
    if (detail) msg += '<br><small style="color:#888">错误详情: ' + escapeHtml(detail) + '</small>';
    document.getElementById('algolia-search-results').innerHTML =
      '<div class="algolia-empty-state"><p>' + msg + '</p></div>';
  }

  function showNoResults(query) {
    document.getElementById('algolia-search-results').innerHTML =
      '<div class="algolia-empty-state"><p>未找到与「' + escapeHtml(query) + '」相关的结果</p></div>';
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  function getHL(hit, attr) {
    if (hit._highlightResult && hit._highlightResult[attr]) return hit._highlightResult[attr].value;
    return hit[attr] || '';
  }

  function trunc(s, n) {
    if (!s) return '';
    s = s.replace(/<[^>]+>/g, '');
    return s.length > n ? s.substring(0, n) + '…' : s;
  }

  function renderResults(hits, query) {
    var box = document.getElementById('algolia-search-results');
    if (!hits.length) { showNoResults(query); return; }

    var h = '<div class="algolia-results-count">' + hits.length + ' 个结果</div>';
    hits.forEach(function(hit, i) {
      var title = getHL(hit, 'title') || '无标题';
      var content = getHL(hit, 'content');
      var url = hit.url || '#';
      var date = hit.date || '';
      var tags = hit.tags || [];

      h += '<a class="algolia-hit" href="' + url + '" data-index="' + i + '">';
      h += '<div class="algolia-hit-title">' + title + '</div>';
      h += '<div class="algolia-hit-content">' + trunc(content, 150) + '</div>';
      if (date || tags.length) {
        h += '<div class="algolia-hit-meta">';
        if (date) h += '<span class="algolia-hit-date">' + date + '</span>';
        if (tags.length) {
          h += '<span class="algolia-hit-tags">';
          tags.slice(0, 3).forEach(function(t) { h += '<span class="algolia-hit-tag">' + escapeHtml(t) + '</span>'; });
          h += '</span>';
        }
        h += '</div>';
      }
      h += '</a>';
    });
    box.innerHTML = h;

    box.querySelectorAll('.algolia-hit').forEach(function(el) {
      el.addEventListener('click', closeAlgoliaSearch);
    });
  }

  /* ---- Input handling ---- */
  function onInput(e) {
    var q = e.target.value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() { doSearch(q); }, 200);
  }

  function onKeydown(e) {
    var hits = document.querySelectorAll('.algolia-hit');
    if (!hits.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIndex = Math.min(selectedIndex + 1, hits.length - 1);
      sel(hits);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIndex = Math.max(selectedIndex - 1, 0);
      sel(hits);
    } else if (e.key === 'Enter' && selectedIndex >= 0) {
      e.preventDefault();
      window.location.href = hits[selectedIndex].getAttribute('href');
      closeAlgoliaSearch();
    }
  }

  function sel(hits) {
    hits.forEach(function(el, i) {
      if (i === selectedIndex) { el.classList.add('selected'); el.scrollIntoView({ block: 'nearest' }); }
      else el.classList.remove('selected');
    });
  }

  /* ---- Init ---- */
  document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('algolia-search-input');
    if (input) {
      input.addEventListener('input', onInput);
      input.addEventListener('keydown', onKeydown);
    }
  });

  window.openAlgoliaSearch = function() {
    var modal = document.getElementById('algolia-search-modal');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    setTimeout(function() {
      var input = document.getElementById('algolia-search-input');
      if (input) { input.value = ''; input.focus(); showEmpty(); }
    }, 100);
  };

  window.closeAlgoliaSearch = function() {
    document.getElementById('algolia-search-modal').style.display = 'none';
    document.body.style.overflow = '';
    selectedIndex = -1;
  };
})();
</script>

<style>
  .algolia-modal{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh}
  .algolia-modal-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
  .algolia-modal-content{position:relative;width:90%;max-width:600px;background:#1a1a1a;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;border:1px solid #333}
  .algolia-search-header{padding:16px;border-bottom:1px solid #333}
  .algolia-search-input-wrapper{display:flex;align-items:center;gap:12px;background:#2a2a2a;border-radius:8px;padding:12px 16px;border:1px solid #444}
  .algolia-search-input-wrapper svg{color:#666;flex-shrink:0}
  #algolia-search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit}
  #algolia-search-input::placeholder{color:#666}
  .algolia-esc{background:#444;color:#999;padding:2px 6px;border-radius:4px;font-size:11px;font-family:inherit}
  .algolia-search-results{max-height:400px;overflow-y:auto;padding:8px}
  .algolia-empty-state{padding:40px 20px;text-align:center;color:#666}
  .algolia-results-count{padding:8px 12px;font-size:12px;color:#666}
  .algolia-search-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid #333;background:#222;font-size:12px;color:#666}
  .algolia-footer-text kbd{background:#444;color:#999;padding:2px 4px;border-radius:3px;font-size:10px;margin:0 2px}
  .algolia-footer-logo a{color:#5EEAD4;text-decoration:none}
  .algolia-footer-logo a:hover{text-decoration:underline}
  .algolia-hit{display:block;padding:12px;border-radius:6px;text-decoration:none;color:#fff;transition:background .2s}
  .algolia-hit:hover,.algolia-hit.selected{background:#2a2a2a}
  .algolia-hit-title{font-weight:600;color:#5EEAD4;margin-bottom:4px;font-size:15px}
  .algolia-hit-title mark,.algolia-highlight{background:rgba(94,234,212,.25);color:#5EEAD4;padding:0 2px;border-radius:2px}
  .algolia-hit-content{font-size:13px;color:#999;line-height:1.5}
  .algolia-hit-content mark,.algolia-hit-content .algolia-highlight{background:rgba(94,234,212,.2);color:#ccc;padding:0 2px;border-radius:2px}
  .algolia-hit-meta{display:flex;align-items:center;gap:10px;margin-top:8px}
  .algolia-hit-date{font-size:12px;color:#666}
  .algolia-hit-tags{display:flex;gap:6px}
  .algolia-hit-tag{background:#333;color:#999;padding:2px 8px;border-radius:4px;font-size:11px}
</style>

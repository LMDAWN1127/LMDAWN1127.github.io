<!-- Algolia DocSearch Modal -->
<div id="algolia-search-modal" class="algolia-modal" style="display: none;">
  <div class="algolia-modal-overlay"></div>
  <div class="algolia-modal-content">
    <div class="algolia-search-header">
      <div class="algolia-search-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="algolia-search-input" placeholder="搜索文章..." autofocus>
        <kbd class="algolia-esc">Esc</kbd>
      </div>
    </div>
    <div id="algolia-search-results" class="algolia-search-results">
      <div class="algolia-empty-state">
        <p>输入关键词开始搜索</p>
      </div>
    </div>
    <div class="algolia-search-footer">
      <span class="algolia-footer-text">
        <kbd>↑</kbd> <kbd>↓</kbd> 导航
        <kbd>↵</kbd> 打开
        <kbd>Esc</kbd> 关闭
      </span>
      <span class="algolia-footer-logo">
        搜索由 <a href="https://www.algolia.com/" target="_blank" rel="noopener">Algolia</a> 提供
      </span>
    </div>
  </div>
</div>

<!-- Algolia DocSearch CSS and JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3" />
<script src="https://cdn.jsdelivr.net/npm/@docsearch/js@3"></script>
<script>
  // Initialize Algolia DocSearch
  docsearch({
    container: '#algolia-search-input',
    appId: '{{ site.Params.algolia.appId }}',
    indexName: '{{ site.Params.algolia.indexName }}',
    apiKey: '{{ site.Params.algolia.apiKey }}',
  });
</script>

<style>

  .algolia-modal-content {

    max-width: 600px;
    background: #1a1a1a;
    border-radius: 12px;

    overflow: hidden;
    border: 1px solid #333;
  }

  .algolia-search-header {
    padding: 16px;
    border-bottom: 1px solid #333;
  }

  .algolia-search-input-wrapper {

    color: #666;

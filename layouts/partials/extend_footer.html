{{- /*
  PaperMod 主题官方扩展点：extend_footer.html
  加载我们的自定义 JS（语言下拉、搜索快捷键、搜索按钮）
*/ -}}
{{- if not site.Params.disableLangToggle }}
<script defer src="{{ "/js/custom.js" | relURL }}"></script>
{{- end }}

{{- if not site.Params.disableSearch }}
{{- partial "algolia-search.html" . -}}
<script>
  // Keyboard shortcuts for Algolia search
  document.addEventListener('keydown', function(e) {
    // Cmd+K or Ctrl+K to open search
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (typeof openAlgoliaSearch === 'function') openAlgoliaSearch();
    }
    // Escape to close search
    if (e.key === 'Escape') {
      if (typeof closeAlgoliaSearch === 'function') closeAlgoliaSearch();
    }
    // Alt+/ to open search
    if (e.altKey && e.key === '/') {
      e.preventDefault();
      if (typeof openAlgoliaSearch === 'function') openAlgoliaSearch();
    }
  });

  // Close modal when clicking overlay
  document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('algolia-search-modal');
    if (modal) {
      var overlay = modal.querySelector('.algolia-modal-overlay');
      if (overlay) {
        overlay.addEventListener('click', function() {
          if (typeof closeAlgoliaSearch === 'function') closeAlgoliaSearch();
        });
      }
    }
  });

  // Inject a visible search button into the header (restore the search entry point
  // that was lost when the custom header.html was removed during earlier reverts).
  document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('algolia-search-btn')) return;
    var btn = document.createElement('button');
    btn.id = 'algolia-search-btn';
    btn.className = 'theme-toggle search-toggle';
    btn.type = 'button';
    btn.title = '搜索 (Ctrl+K)';
    btn.setAttribute('aria-label', '搜索');
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
    btn.addEventListener('click', function() {
      if (typeof openAlgoliaSearch === 'function') openAlgoliaSearch();
    });
    var target = document.querySelector('.logo-switches') || document.querySelector('.header-nav');
    if (target) target.appendChild(btn);
  });
</script>
{{- end }}

{{- /*
  PaperMod 主题官方扩展点：extend_footer.html
  加载我们的自定义 JS（语言下拉、搜索快捷键）
*/ -}}
{{- if not site.Params.disableLangToggle }}
<script defer src="{{ "/js/custom.js" | relURL }}"></script>
{{- end }}

{{- if not site.Params.disableSearch }}
{{- partial "algolia-search.html" . -}}
<script>
  // Keyboard shortcuts for Algolia search
  document.addEventListener('keydown', function(e) {
    // Cmd+K or Ctrl+K to open search
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (typeof openAlgoliaSearch === 'function') openAlgoliaSearch();
    }
    // Escape to close search
    if (e.key === 'Escape') {
      if (typeof closeAlgoliaSearch === 'function') closeAlgoliaSearch();
    }
    // Alt+/ to open search
    if (e.altKey && e.key === '/') {
      e.preventDefault();
      if (typeof openAlgoliaSearch === 'function') openAlgoliaSearch();
    }
  });

  // Close modal when clicking overlay
  document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('algolia-search-modal');
    if (modal) {
      var overlay = modal.querySelector('.algolia-modal-overlay');
      if (overlay) {
        overlay.addEventListener('click', function() {
          if (typeof closeAlgoliaSearch === 'function') closeAlgoliaSearch();
        });
      }
    }
  });
</script>
{{- end }}

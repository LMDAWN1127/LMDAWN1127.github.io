<div class="mermaid" role="img" aria-label="拓扑图">
{{- .Inner | htmlEscape | safeHTML -}}
</div>
<script>
/* 渲染钩子自带加载：每页只注入一次 mermaid；主源国内可达优先，失败自动回落备用源 */
(function () {
  if (window.__mermaidInjected) { return; }
  window.__mermaidInjected = true;

  var SOURCES = [
    'https://cdn.staticfile.org/mermaid/10.9.1/mermaid.min.js',
    'https://unpkg.com/mermaid@10/dist/mermaid.min.js'
  ];

  function init() {
    try {
      window.mermaid.initialize({
        startOnLoad: true,
        securityLevel: 'loose',
        theme: 'default'
      });
    } catch (e) { console.error('mermaid init failed:', e); }
  }

  function load(i) {
    if (i >= SOURCES.length) { console.error('mermaid: all CDN sources failed'); return; }
    var s = document.createElement('script');
    s.src = SOURCES[i];
    s.async = true;
    s.onload = init;
    s.onerror = function () { load(i + 1); };
    document.head.appendChild(s);
  }
  load(0);
})();
</script>

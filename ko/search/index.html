<script>
(function() {
  'use strict';

  var APP_ID = 'Y0SCRI4LCW';
  var SEARCH_KEY = '03dda5e44aec7e0dd93b6a3653250b1f';
  var INDEX_NAME = 'lmdawn1127-blog';
  var API_URL = 'https://' + APP_ID + '-dsn.algolia.net/1/indexes/' + INDEX_NAME + '/query';
  var debounceTimer = null;
  var selectedIndex = -1;

   
  function doSearch(query) {
    if (!query || !query.trim()) {
      showEmpty();
      return;
    }

    var body = JSON.stringify({
      query: query,
      hitsPerPage: 10,
      attributesToRetrieve: ['title', 'content', 'url'],
      attributesToHighlight: ['title', 'content'],
      highlightPreTag: '<mark class="algolia-highlight">',
      highlightPostTag: '</mark>'
    });

    fetch(API_URL, {
      method: 'POST',
      headers: {
        'X-Algolia-Application-Id': APP_ID,
        'X-Algolia-API-Key': SEARCH_KEY,
        'Content-Type': 'application/json'
      },
      body: body
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      renderResults(data.hits || [], query);
    })
    .catch(function(err) {
      console.error('Algolia search error:', err);
      showError(err.message || '未知错误');
    });
  }

   
  function showEmpty() {
    document.getElementById('algolia-search-results').innerHTML =
      '<div class="algolia-empty-state"><p>输入关键词开始搜索</p></div>';
  }

  function showError(detail) {
    var msg = '搜索出错，请稍后再试';
    if (detail) msg += '<br><small style="color:#888">错误详情: ' + escapeHtml(detail) + '</small>';
    document.getElementById('algolia-search-results').innerHTML =
      '<div class="algolia-empty-state"><p>' + msg + '</p></div>';
  }

  function showNoResults(query) {
    document.getElementById('algolia-search-results').innerHTML =
      '<div class="algolia-empty-state"><p>未找到与「' + escapeHtml(query) + '」相关的结果</p></div>';
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  function getHL(hit, attr) {
    if (hit._highlightResult && hit._highlightResult[attr]) return hit._highlightResult[attr].value;
    return hit[attr] || '';
  }

  function trunc(s, n) {
    if (!s) return '';
    s = s.replace(/<[^>]+>/g, '');
    return s.length > n ? s.substring(0, n) + '…' : s;
  }

  function renderResults(hits, query) {
    var box = document.getElementById('algolia-search-results');
    if (!hits.length) { showNoResults(query); return; }

    var h = '<div class="algolia-results-count">' + hits.length + ' 个结果</div>';
    hits.forEach(function(hit, i) {
      var title = getHL(hit, 'title') || '无标题';
      var content = getHL(hit, 'content');
      var url = hit.url || '#';

      h += '<a class="algolia-hit" href="' + url + '" data-index="' + i + '">';
      h += '<div class="algolia-hit-title">' + title + '</div>';
      h += '<div class="algolia-hit-content">' + trunc(content, 150) + '</div>';

      h += '</a>';
    });
    box.innerHTML = h;

    box.querySelectorAll('.algolia-hit').forEach(function(el) {
      el.addEventListener('click', closeAlgoliaSearch);
    });
  }

   
  function onInput(e) {
    var q = e.target.value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() { doSearch(q); }, 200);
  }

  function onKeydown(e) {
    var hits = document.querySelectorAll('.algolia-hit');
    if (!hits.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIndex = Math.min(selectedIndex + 1, hits.length - 1);
      sel(hits);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIndex = Math.max(selectedIndex - 1, 0);
      sel(hits);
    } else if (e.key === 'Enter' && selectedIndex >= 0) {
      e.preventDefault();
      window.location.href = hits[selectedIndex].getAttribute('href');
      closeAlgoliaSearch();
    }
  }

  function sel(hits) {
    hits.forEach(function(el, i) {
      if (i === selectedIndex) { el.classList.add('selected'); el.scrollIntoView({ block: 'nearest' }); }
      else el.classList.remove('selected');
    });
  }

   
  document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('algolia-search-input');
    if (input) {
      input.addEventListener('input', onInput);
      input.addEventListener('keydown', onKeydown);
    }
  });

  window.openAlgoliaSearch = function() {
    var modal = document.getElementById('algolia-search-modal');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    setTimeout(function() {
      var input = document.getElementById('algolia-search-input');
      if (input) { input.value = ''; input.focus(); showEmpty(); }
    }, 100);
  };

  window.closeAlgoliaSearch = function() {
    document.getElementById('algolia-search-modal').style.display = 'none';
    document.body.style.overflow = '';
    selectedIndex = -1;
  };
})();
</script>

<script>
  
  document.addEventListener('keydown', function(e) {
    
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (typeof openAlgoliaSearch === 'function') openAlgoliaSearch();
    }
    
    if (e.key === 'Escape') {
      if (typeof closeAlgoliaSearch === 'function') closeAlgoliaSearch();
    }
    
    if (e.altKey && e.key === '/') {
      e.preventDefault();
      if (typeof openAlgoliaSearch === 'function') openAlgoliaSearch();
    }
  });

  
  document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('algolia-search-modal');
    if (modal) {
      var overlay = modal.querySelector('.algolia-modal-overlay');
      if (overlay) {
        overlay.addEventListener('click', function() {
          if (typeof closeAlgoliaSearch === 'function') closeAlgoliaSearch();
        });
      }
    }
  });
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });
</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };
</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })
</script>

name: Deploy Hugo Site

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload Algolia Index
        env:
          ALGOLIA_APP_ID: Y0SCRI4LCW
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_INDEX_NAME: lmdawn1127-blog
        run: |
          if [ -f public/algolia.json ] && [ -n "$ALGOLIA_API_KEY" ]; then
            echo "Uploading algolia.json to Algolia..."
            # Build batch request from JSON array
            BATCH=$(jq '{requests: [.[] | {action: "addObject", body: .}]}' public/algolia.json)
            # Clear existing index first
            curl -s -X POST \
              "https://${ALGOLIA_APP_ID}-dsn.algolia.net/1/indexes/${ALGOLIA_INDEX_NAME}/clear" \
              -H "X-Algolia-Application-Id: ${ALGOLIA_APP_ID}" \
              -H "X-Algolia-API-Key: ${ALGOLIA_API_KEY}"
            # Upload new records
            curl -s -X POST \
              "https://${ALGOLIA_APP_ID}-dsn.algolia.net/1/indexes/${ALGOLIA_INDEX_NAME}/batch" \
              -H "X-Algolia-Application-Id: ${ALGOLIA_APP_ID}" \
              -H "X-Algolia-API-Key: ${ALGOLIA_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$BATCH"
            echo "Algolia index uploaded successfully."
          else
            echo "algolia.json not found or ALGOLIA_API_KEY not set, skipping upload."
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
